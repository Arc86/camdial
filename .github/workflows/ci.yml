name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Verify Swift, Clang & SDK Environment
        run: |
          swift --version
          clang --version
          xcrun --show-sdk-path

      - name: Build CLI & App Bundle
        run: |
          make clean
          make all

      - name: Verify CLI Binary
        run: |
          test -f build/camdial
          ./build/camdial preset list

      - name: Verify macOS App Bundle Structure & Signatures
        run: |
          test -d build/CamDial.app
          test -f build/CamDial.app/Contents/MacOS/CamDial
          test -f build/CamDial.app/Contents/Info.plist
          codesign -vvv build/CamDial.app
          codesign -vvv build/camdial

      - name: Package Distributable Archive
        run: |
          make dist
          test -f build/CamDial-*.zip
