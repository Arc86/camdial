name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Swift & Clang Environment
        run: |
          swift --version
          clang --version

      - name: Build CLI & App Bundle
        run: |
          make clean
          make all

      - name: Verify CLI Binary
        run: |
          test -f build/camdial
          ./build/camdial preset list

      - name: Verify macOS App Bundle Structure
        run: |
          test -d build/CamDial.app
          test -f build/CamDial.app/Contents/MacOS/CamDial
          test -f build/CamDial.app/Contents/Info.plist

      - name: Package Distributable Archive
        run: |
          make dist
          test -f build/CamDial-v1.0.0.zip
