name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Application & CLI
        run: |
          make clean
          make all

      - name: Package Release Archive
        id: package
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          ARCHIVE_NAME="CamDial-${VERSION}.zip"
          cd build
          zip -r -y "${ARCHIVE_NAME}" CamDial.app camdial
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          echo "archive_path=build/${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CamDial ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.archive_path }}
            build/camdial
